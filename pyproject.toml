[project]
name = "labelkit"
version = "0.1.0"
description = "Turn food-label photos into structured, translated e-commerce product data with a vision LLM (local or OpenAI)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pillow>=10",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "rapidfuzz>=3.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
app = ["gradio>=4.44"]

[project.scripts]
labelkit = "labelkit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# imports follow the sys.path fallback that lets the app run without installing the package
"app/app.py" = ["E402"]
