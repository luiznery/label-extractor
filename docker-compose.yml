# `docker compose up` -> app on http://localhost:7860 with local models, no API key needed.
services:
  ollama:
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
  pull-models:  # one-off: downloads the two models on first start (~5 GB), then exits
    image: ollama/ollama
    environment: [OLLAMA_HOST=ollama:11434]
    entrypoint: ["sh", "-c", "ollama pull qwen2.5vl:3b && ollama pull qwen2.5:3b"]
    depends_on: { ollama: { condition: service_healthy } }
  app:
    build: .
    ports: ["7860:7860"]
    environment:
      LABELKIT_BASE_URL: http://ollama:11434/v1
    volumes: [./output:/app/output]  # the catalog survives restarts
    depends_on: { pull-models: { condition: service_completed_successfully } }
volumes:
  ollama:
